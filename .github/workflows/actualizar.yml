name: Actualizar precios

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días a las 6:00 (Argentina)
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar productos con la API de Mercado Libre
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add productos.json ids.json
          git diff --cached --quiet || git commit -m "Precios actualizados $(date -u +'%Y-%m-%d')"
          git push
